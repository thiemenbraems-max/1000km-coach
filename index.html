<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1000km">
<title>1000km Coach</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f2f2f7; color: #1c1c1e; }

/* NAV */
.tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ddd; padding-bottom: env(safe-area-inset-bottom, 8px); z-index: 99; }
.tab { flex: 1; text-align: center; padding: 10px 4px 6px; cursor: pointer; font-size: 10px; color: #8e8e93; border: none; background: none; font-family: -apple-system, sans-serif; }
.tab.on { color: #1a56db; }
.tab span { display: block; font-size: 22px; margin-bottom: 2px; }

/* SCREENS */
.screen { display: none; padding: 20px 16px 100px; min-height: 100vh; background: #f2f2f7; }
.screen.on { display: block; }

/* CARDS */
h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.sub { font-size: 14px; color: #8e8e93; margin-bottom: 18px; }
.card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.lbl { font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }

/* HERO */
.hero { border-radius: 18px; overflow: hidden; margin-bottom: 12px; }
.hero-top { padding: 18px 16px; }
.hero-tag { font-size: 11px; color: rgba(255,255,255,.8); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
.hero-name { font-size: 24px; font-weight: 700; color: #fff; }
.hero-meta { font-size: 13px; color: rgba(255,255,255,.8); margin-top: 4px; }
.hero-body { background: #fff; padding: 14px 16px; }

/* EXERCISE ROWS */
.ex { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.ex:last-child { border-bottom: none; }
.ex-n { font-size: 12px; color: #8e8e93; width: 18px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.ex-nm { font-size: 15px; font-weight: 500; }
.ex-dt { font-size: 13px; color: #8e8e93; }

/* BUTTONS */
.btn { display: block; width: 100%; padding: 14px; border-radius: 13px; border: none; font-size: 16px; font-weight: 600; font-family: -apple-system, sans-serif; cursor: pointer; margin-top: 10px; text-align: center; }
.btn-blue { background: #1a56db; color: #fff; }
.btn-gray { background: #e9e9ef; color: #1c1c1e; }
.btn-green { background: #1c7d4a; color: #fff; }
.btn-red { background: #fff0f0; color: #dc2626; }

/* WEEK SCHEMA */
.week-card { background: #fff; border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.week-head { display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid #f0f0f0; }
.week-head strong { font-size: 14px; }
.week-head span { font-size: 12px; color: #8e8e93; }
.wday { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid #f6f6f6; cursor: pointer; }
.wday:last-child { border-bottom: none; }
.wday.dim { opacity: .4; cursor: default; }
.wday-lbl { font-size: 12px; color: #8e8e93; font-weight: 600; width: 24px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-k { background: #b45309; }
.dot-l { background: #1c7d4a; }
.dot-f { background: #1a56db; }
.dot-r { background: #ccc; }
.wday-nm { flex: 1; font-size: 14px; font-weight: 500; }
.wday-dur { font-size: 12px; color: #8e8e93; }

/* WORKOUT OVERLAY */
#wkov { display: none; position: fixed; inset: 0; background: #f2f2f7; z-index: 200; overflow-y: auto; padding-bottom: 40px; }
.wkh { display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 0; }
.wkh-close { font-size: 15px; color: #1a56db; font-weight: 500; cursor: pointer; }
.wkh-title { font-size: 15px; font-weight: 600; }
.wkh-meta { font-size: 14px; color: #8e8e93; }
.wkbar { height: 3px; background: #e0e0e0; margin: 14px 18px 0; border-radius: 2px; }
.wkbar-fill { height: 100%; background: #1a56db; border-radius: 2px; transition: width .4s; }
.wk-body { padding: 28px 20px 16px; text-align: center; min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.wk-nm { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.wk-sub { font-size: 15px; color: #8e8e93; margin-bottom: 24px; }
.wk-big { font-size: 80px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -3px; line-height: 1; font-family: -apple-system, sans-serif; }
.wk-big.blue { color: #1a56db; }
.wk-big.grn { color: #1c7d4a; }
.wk-tip { background: #e8f0fd; border-radius: 12px; padding: 12px 14px; margin-top: 20px; text-align: left; width: 100%; max-width: 340px; }
.wk-tip b { font-size: 11px; color: #1a56db; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
.wk-tip p { font-size: 13px; color: #333; line-height: 1.55; }
.wk-rest-body { background: #e3f5ec; min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
.wk-rest-lbl { font-size: 13px; font-weight: 700; color: #1c7d4a; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.wk-rest-next { font-size: 16px; color: #333; margin-top: 14px; }
.wk-run-body { min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
.seg-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
.seg-run { background: #fef3c7; color: #b45309; }
.seg-walk { background: #e3f5ec; color: #1c7d4a; }
.wk-complete { min-height: 58vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
.wk-btns { padding: 0 18px 32px; display: flex; flex-direction: column; gap: 10px; }

/* PROFIEL */
.pset { background: #fff; border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.prow { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid #f0f0f0; }
.prow:last-child { border-bottom: none; }
.prow-lbl { font-size: 15px; }
.prow-val { font-size: 14px; color: #8e8e93; }
.prow input[type=date] { font-size: 14px; color: #1a56db; background: transparent; border: none; outline: none; text-align: right; font-family: -apple-system, sans-serif; }
.prow.tap { cursor: pointer; }
.prow.tap:active { background: #f5f5f5; }

/* LOG ROWS */
.logrow { background: #fff; border-radius: 12px; margin-bottom: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.logrow-info { flex: 1; }
.logrow-nm { font-size: 14px; font-weight: 500; }
.logrow-dt { font-size: 12px; color: #8e8e93; margin-top: 1px; }
.logrow-dur { font-size: 13px; color: #8e8e93; font-variant-numeric: tabular-nums; }

/* TOAST */
#toast { position: fixed; bottom: 90px; left: 16px; right: 16px; background: #1c7d4a; color: #fff; padding: 14px; border-radius: 13px; text-align: center; font-weight: 600; font-size: 15px; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }

@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
.pulse { animation: pulse 1s infinite; }

/* PHASE PILLS */
.pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1.5px solid #ccc; color: #8e8e93; background: transparent; font-family: -apple-system, sans-serif; cursor: pointer; }
.pill.on { background: #1a56db; color: #fff; border-color: #1a56db; }

/* REST CARD */
.rest-card { background: #fff; border-radius: 18px; padding: 36px 20px; text-align: center; margin-bottom: 12px; }
.rest-icon { font-size: 44px; margin-bottom: 10px; }
.rest-title { font-size: 22px; font-weight: 700; }
.rest-sub { font-size: 14px; color: #8e8e93; margin-top: 6px; }

/* WEEK BAR */
.wkbar-card { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.wkbar-row { display: flex; justify-content: space-between; font-size: 13px; color: #8e8e93; margin-bottom: 8px; }
.wkbar2 { height: 4px; background: #e0e0e0; border-radius: 2px; }
.wkbar2-fill { height: 100%; background: #1a56db; border-radius: 2px; }
</style>
</head>
<body>

<!-- SCREENS -->
<div id="s-today" class="screen on">
  <h1 id="t-greeting">Goedenavond, Thiemen</h1>
  <p class="sub" id="t-date"></p>
  <div id="t-body"></div>
</div>

<div id="s-schema" class="screen">
  <h1>12-weken plan</h1>
  <p class="sub">Tik op een sessie om te starten</p>
  <div class="pills" id="pills"></div>
  <div id="schema-body"></div>
</div>

<div id="s-profiel" class="screen">
  <h1>Profiel</h1>
  <p class="sub">Instellingen en voortgang</p>
  <div class="lbl">Startdatum</div>
  <div class="pset">
    <div class="prow"><span class="prow-lbl">Eerste trainingsmaandag</span><input type="date" id="dateinput" onchange="setDate(this.value)"></div>
  </div>
  <div class="lbl">Agenda</div>
  <div class="pset">
    <div class="prow tap" onclick="exportCal()"><span class="prow-lbl">📅 Exporteer naar Apple Agenda</span><span class="prow-val">→</span></div>
  </div>
  <div class="lbl">Voortgang</div>
  <div class="pset">
    <div class="prow"><span class="prow-lbl">Sessies voltooid</span><span class="prow-val" id="p-s">0</span></div>
    <div class="prow"><span class="prow-lbl">Huidige week</span><span class="prow-val" id="p-w">—</span></div>
    <div class="prow"><span class="prow-lbl">Langste fietsrit</span><span class="prow-val" id="p-r">—</span></div>
  </div>
  <div class="lbl">Logboek</div>
  <div id="log-body"></div>
  <button class="btn btn-red" onclick="if(confirm('Wis logboek?'))wipeLog()" style="margin-top:4px;">Logboek wissen</button>
</div>

<!-- TAB BAR -->
<div class="tabs">
  <button class="tab on" id="tab-today" onclick="goTab('today')"><span>🏠</span>Vandaag</button>
  <button class="tab" id="tab-schema" onclick="goTab('schema')"><span>📋</span>Schema</button>
  <button class="tab" id="tab-profiel" onclick="goTab('profiel')"><span>⚙️</span>Profiel</button>
</div>

<!-- WORKOUT OVERLAY -->
<div id="wkov"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
var EX={
  squat:{n:'Squat',t:'Voeten schouderbreedte, tenen licht naar buiten. Zak tot dijen parallel. Knieën naar buiten, hakken in de grond.'},
  pushup:{n:'Push-up',t:'Rechte plank hoofd–hielen. Ellebogen schuin achterwaarts. Op knieën mag.'},
  plank:{n:'Plank',t:'Onderarmen en tenen. Buik hard aanspannen. Heupen niet laten zakken. Adem door.'},
  lunge:{n:'Lunge',t:'Grote stap vooruit, recht omlaag. Voorste knie boven de voet. Romp recht. Duw terug via je hiel.'},
  mc:{n:'Mountain climbers',t:'Push-up positie, heupen laag. Knieën afwisselend naar borst. Bouw tempo op.'},
  glute:{n:'Glute bridge',t:'Rug op grond, knieën gebogen. Heupen omhoog tot rechte lijn. Billen maximaal aanspannen boven.'},
  jsquat:{n:'Jump squat',t:'Gewone squat, explosief omhoog springen. Land zacht op de ballen van je voeten.'},
  rlunge:{n:'Reverse lunge',t:'Stap achterwaarts, achterknie bijna de grond. Minder belasting op knie dan voorwaartse lunge.'},
  burpee:{n:'Burpee',t:'Staand → handen grond → plank → voeten terug → spring omhoog. Ritmisch werken.'},
  dip:{n:'Dip (stoel)',t:'Handen op rand stoel achter je, voeten gestrekt. Buig tot 90° en duw terug. Rug dicht bij stoel.'},
};

function K(r,es){return{type:'kracht',rounds:r,rr:90,exs:es};}
var WK={
  kA1:K(3,[{id:'squat',reps:20,rest:30},{id:'pushup',reps:12,rest:30},{id:'plank',sec:40,rest:30},{id:'lunge',reps:12,note:'per been',rest:30},{id:'mc',reps:25,rest:30},{id:'glute',reps:20,rest:0}]),
  kB1:K(3,[{id:'glute',reps:20,rest:30},{id:'squat',reps:20,rest:30},{id:'plank',sec:40,rest:30},{id:'pushup',reps:12,rest:30},{id:'lunge',reps:12,note:'per been',rest:30},{id:'mc',reps:25,rest:0}]),
  kA2:K(3,[{id:'jsquat',reps:15,rest:30},{id:'pushup',reps:15,rest:30},{id:'plank',sec:60,rest:30},{id:'rlunge',reps:15,note:'per been',rest:30},{id:'burpee',reps:10,rest:30},{id:'dip',reps:12,rest:0}]),
  kB2:K(3,[{id:'dip',reps:12,rest:30},{id:'jsquat',reps:15,rest:30},{id:'burpee',reps:10,rest:30},{id:'plank',sec:60,rest:30},{id:'rlunge',reps:15,note:'per been',rest:30},{id:'pushup',reps:15,rest:0}]),
  kA3:K(4,[{id:'jsquat',reps:15,rest:30},{id:'pushup',reps:15,rest:30},{id:'plank',sec:60,rest:30},{id:'rlunge',reps:15,note:'per been',rest:30},{id:'burpee',reps:10,rest:30},{id:'dip',reps:12,rest:0}]),
  kB3:K(4,[{id:'dip',reps:12,rest:30},{id:'jsquat',reps:15,rest:30},{id:'burpee',reps:10,rest:30},{id:'plank',sec:60,rest:30},{id:'rlunge',reps:15,note:'per been',rest:30},{id:'pushup',reps:15,rest:0}]),
};

function lsegs(n,rs,ws){var a=[{n:'Opwarmen',i:'Rustig wandelen',s:300,g:true}];for(var x=0;x<n;x++){a.push({n:'Lopen '+(x+1)+'/'+n,i:'Stevig tempo',s:rs,g:false});if(x<n-1)a.push({n:'Herstel',i:'Rustig joggen',s:ws,g:true});}a.push({n:'Afkoelen',i:'Rustig wandelen',s:300,g:true});return a;}
function csegs(m){return[{n:'Inlopen',i:'Rustig opwarmen',s:300,g:true},{n:'Doorlopen '+m+' min',i:'Constant comfortabel tempo',s:m*60,g:false},{n:'Uitlopen',i:'Rustig afkoelen',s:300,g:true}];}
var LP={l1:{segs:lsegs(6,120,60)},l2:{segs:lsegs(3,480,120)},l3:{segs:csegs(35)}};

var SC=[
  {w:1,p:1,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:35,k:'kA1'},{d:3,l:'Wo',n:'Lopen',t:'lopen',m:28,k:'l1'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:35,k:'kB1'},{d:6,l:'Za',n:'Rust',t:'rest',m:null,k:null}]},
  {w:2,p:1,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:35,k:'kA1'},{d:3,l:'Wo',n:'Lopen',t:'lopen',m:28,k:'l1'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:35,k:'kB1'},{d:6,l:'Za',n:'Rust',t:'rest',m:null,k:null}]},
  {w:3,p:1,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:35,k:'kA1'},{d:3,l:'Wo',n:'Lopen',t:'lopen',m:28,k:'l1'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:35,k:'kB1'},{d:6,l:'Za',n:'Fietsen 35 min',t:'fiets',m:35,k:null}]},
  {w:4,p:1,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:35,k:'kA1'},{d:3,l:'Wo',n:'Lopen',t:'lopen',m:28,k:'l1'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:35,k:'kB1'},{d:6,l:'Za',n:'Fietsen 45 min',t:'fiets',m:45,k:null}]},
  {w:5,p:2,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:40,k:'kA2'},{d:3,l:'Wo',n:'Lopen interval+',t:'lopen',m:36,k:'l2'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:40,k:'kB2'},{d:6,l:'Za',n:'Fietsen 60 min',t:'fiets',m:60,k:null}]},
  {w:6,p:2,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:40,k:'kA2'},{d:3,l:'Wo',n:'Lopen interval+',t:'lopen',m:36,k:'l2'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:40,k:'kB2'},{d:6,l:'Za',n:'Fietsen 60 min',t:'fiets',m:60,k:null}]},
  {w:7,p:2,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:40,k:'kA2'},{d:3,l:'Wo',n:'Lopen interval+',t:'lopen',m:36,k:'l2'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:40,k:'kB2'},{d:6,l:'Za',n:'Fietsen 75 min',t:'fiets',m:75,k:null}]},
  {w:8,p:2,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:40,k:'kA2'},{d:3,l:'Wo',n:'Lopen interval+',t:'lopen',m:36,k:'l2'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:40,k:'kB2'},{d:6,l:'Za',n:'Fietsen 75 min',t:'fiets',m:75,k:null}]},
  {w:9,p:3,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:45,k:'kA3'},{d:3,l:'Wo',n:'Doorlopen 35 min',t:'lopen',m:45,k:'l3'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:45,k:'kB3'},{d:6,l:'Za',n:'Lange rit 90 min',t:'fiets',m:90,k:null}]},
  {w:10,p:3,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:45,k:'kA3'},{d:3,l:'Wo',n:'Doorlopen 35 min',t:'lopen',m:45,k:'l3'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:45,k:'kB3'},{d:6,l:'Za',n:'Lange rit 90 min',t:'fiets',m:90,k:null}]},
  {w:11,p:3,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:45,k:'kA3'},{d:3,l:'Wo',n:'Doorlopen 35 min',t:'lopen',m:45,k:'l3'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:45,k:'kB3'},{d:6,l:'Za',n:'Lange rit 2 uur',t:'fiets',m:120,k:null}]},
  {w:12,p:3,days:[{d:1,l:'Ma',n:'Kracht A',t:'kracht',m:45,k:'kA3'},{d:3,l:'Wo',n:'Doorlopen 35 min',t:'lopen',m:45,k:'l3'},{d:5,l:'Vr',n:'Kracht B',t:'kracht',m:45,k:'kB3'},{d:6,l:'Za',n:'Lange rit 2 uur',t:'fiets',m:120,k:null}]},
];

// ── STORAGE ───────────────────────────────────────────────────────────────────
function ls(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getS(){return ls('cs',{});}
function setS(s){ss('cs',s);}
function getL(){return ls('cl',[]);}
function setL(l){ss('cl',l.slice(0,60));}
function addL(e){var l=getL();l.unshift(e);setL(l);}
function wipeLog(){ss('cl',[]);renderP();}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function ft(s){var m=Math.floor(s/60),sc=s%60;return(m<10?'0':'')+m+':'+(sc<10?'0':'')+sc;}
function beep(f,d){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f||880;g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(d||0.15));o.start();o.stop(c.currentTime+(d||0.15));}catch(e){}}
function triBeep(){beep(880,0.1);setTimeout(function(){beep(880,0.1);},160);setTimeout(function(){beep(1100,0.2);},320);}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3000);}

function getWI(){
  var s=getS();if(!s.startDate)return null;
  var st=new Date(s.startDate);st.setHours(0,0,0,0);
  var td=new Date();td.setHours(0,0,0,0);
  var d=Math.floor((td-st)/86400000);
  if(d<0)return{future:true,dl:-d};
  var wi=Math.min(Math.floor(d/7),11);
  return{wi:wi,wk:SC[wi],dow:td.getDay()};
}

// ── NAV ───────────────────────────────────────────────────────────────────────
var AT='today';
function goTab(t){
  ['today','schema','profiel'].forEach(function(x){
    document.getElementById('s-'+x).classList.toggle('on',x===t);
    document.getElementById('tab-'+x).classList.toggle('on',x===t);
  });
  AT=t;
  if(t==='today')renderT();
  if(t==='schema')renderSC();
  if(t==='profiel')renderP();
}

// ── TODAY ─────────────────────────────────────────────────────────────────────
function renderT(){
  var now=new Date(),h=now.getHours();
  document.getElementById('t-greeting').textContent=(h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond')+', Thiemen';
  document.getElementById('t-date').textContent=now.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
  var s=getS(),body=document.getElementById('t-body'),html='';
  if(!s.startDate){body.innerHTML='<div class="card" style="text-align:center;padding:32px 16px;"><div style="font-size:44px;margin-bottom:14px;">🚴</div><div style="font-size:20px;font-weight:700;margin-bottom:8px;">Welkom, Thiemen</div><div style="font-size:14px;color:#8e8e93;margin-bottom:20px;">Stel je startdatum in om te starten.</div><button class="btn btn-blue" onclick="goTab(\'profiel\')">Startdatum instellen →</button></div>';return;}
  var info=getWI();
  if(!info){body.innerHTML='';return;}
  if(info.future){body.innerHTML='<div class="rest-card"><div class="rest-icon">⏳</div><div class="rest-title">Start over '+info.dl+' dag'+(info.dl===1?'':'en')+'</div><div class="rest-sub">Eerste trainingsmaandag komt eraan</div></div>';return;}
  var log=getL(),wkst=new Date(s.startDate);
  wkst.setDate(wkst.getDate()+info.wi*7);wkst.setHours(0,0,0,0);
  var wkend=new Date(wkst);wkend.setDate(wkend.getDate()+7);
  var done=log.filter(function(e){var d=new Date(e.date);return d>=wkst&&d<wkend;}).length;
  html+='<div class="wkbar-card"><div class="wkbar-row"><span>Week '+(info.wi+1)+' · Fase '+info.wk.p+'</span><span>'+done+'/3 sessies</span></div><div class="wkbar2"><div class="wkbar2-fill" style="width:'+Math.round(done/3*100)+'%;"></div></div></div>';
  var sess=null;for(var i=0;i<info.wk.days.length;i++){if(info.wk.days[i].d===info.dow){sess=info.wk.days[i];break;}}
  if(!sess||sess.t==='rest'){html+='<div class="rest-card"><div class="rest-icon">😴</div><div class="rest-title">Rustdag</div><div class="rest-sub">Herstel is training. Actief bewegen mag.</div></div>';}
  else if(sess.t==='fiets'){html+='<div class="hero"><div class="hero-top" style="background:#1a56db;"><div class="hero-tag">Vandaag · Week '+(info.wi+1)+'</div><div class="hero-name">🚴 '+sess.n+'</div><div class="hero-meta">⏱ '+sess.m+' min · Ochtend of namiddag</div></div><div class="hero-body"><p style="font-size:14px;color:#444;line-height:1.6;margin-bottom:12px;">Rit van '+sess.m+' min. Comfortabel tempo — je kan een gesprek voeren.</p><button class="btn btn-blue" onclick="startFiets('+sess.m+',\''+sess.n+'\')">⏱ Start fietsklok</button></div></div>';}
  else{var col=sess.t==='kracht'?'#b45309':'#1c7d4a',icon=sess.t==='kracht'?'💪':'🏃';html+='<div class="hero"><div class="hero-top" style="background:'+col+';"><div class="hero-tag">Vandaag · Week '+(info.wi+1)+'</div><div class="hero-name">'+icon+' '+sess.n+'</div><div class="hero-meta">⏱ ~'+sess.m+' min · Na 21u</div></div><div class="hero-body">';
  if(sess.t==='kracht'&&sess.k){var wk=WK[sess.k];html+='<div style="font-size:13px;color:#8e8e93;margin-bottom:10px;">'+wk.rounds+' ronden · '+wk.exs.length+' oefeningen · '+wk.rr+'s rust tussen ronden</div><div>';for(var j=0;j<wk.exs.length;j++){var ex=wk.exs[j],exd=EX[ex.id];html+='<div class="ex"><div class="ex-n">'+(j+1)+'</div><div><div class="ex-nm">'+exd.n+'</div><div class="ex-dt">'+(ex.sec?ex.sec+'s':ex.reps+(ex.note?' '+ex.note:' herh.'))+'</div></div></div>';}html+='</div><button class="btn btn-blue" onclick="startKracht(\''+sess.k+'\',\''+sess.n+'\')">▶ Start workout</button>';}
  else if(sess.t==='lopen'&&sess.k){var lp=LP[sess.k],tot=Math.round(lp.segs.reduce(function(a,s){return a+s.s;},0)/60);html+='<div style="font-size:13px;color:#8e8e93;margin-bottom:10px;">'+lp.segs.length+' segmenten · '+tot+' min totaal</div><div>';for(var k=0;k<lp.segs.length;k++){var sg=lp.segs[k];html+='<div class="ex"><div class="dot '+(sg.g?'dot-l':'dot-k')+'" style="margin-top:2px;"></div><div><div class="ex-nm">'+sg.n+'</div><div class="ex-dt">'+Math.round(sg.s/60)+' min · '+sg.i+'</div></div></div>';}html+='</div><button class="btn btn-blue" onclick="startLopen(\''+sess.k+'\',\''+sess.n+'\')">▶ Start loopsessie</button>';}
  html+='</div></div>';}
  var up=[];for(var u=0;u<info.wk.days.length;u++){if(info.wk.days[u].d>info.dow&&info.wk.days[u].t!=='rest')up.push(info.wk.days[u]);}
  if(up.length){html+='<div class="lbl">Later deze week</div>';var dl=['Zo','Ma','Di','Wo','Do','Vr','Za'];for(var v=0;v<up.length;v++){var uu=up[v],dc=uu.t==='kracht'?'dot-k':uu.t==='lopen'?'dot-l':'dot-f';html+='<div class="logrow"><div class="dot '+dc+'"></div><div class="logrow-info"><div class="logrow-nm">'+dl[uu.d]+' — '+uu.n+'</div></div><div class="logrow-dur">'+(uu.m?uu.m+'m':'')+'</div></div>';}}
  body.innerHTML=html;
}

// ── SCHEMA ────────────────────────────────────────────────────────────────────
var AP=1;
function renderSC(){
  var pills=document.getElementById('pills'),h='';
  for(var p=1;p<=3;p++)h+='<button class="pill'+(AP===p?' on':'')+'" onclick="setP('+p+')">Fase '+p+' — wk '+((p-1)*4+1)+'–'+(p*4)+'</button>';
  pills.innerHTML=h;
  var body=document.getElementById('schema-body');h='';
  for(var i=0;i<SC.length;i++){var wk=SC[i];if(wk.p!==AP)continue;
    h+='<div class="week-card"><div class="week-head"><strong>Week '+wk.w+'</strong><span>Fase '+wk.p+'</span></div>';
    for(var j=0;j<wk.days.length;j++){var s=wk.days[j],dc=s.t==='kracht'?'dot-k':s.t==='lopen'?'dot-l':s.t==='fiets'?'dot-f':'dot-r',tap=s.k||(s.t==='fiets'&&s.m)?true:false;
      var oc='';if(s.t==='kracht'&&s.k)oc='onclick="startKracht(\''+s.k+'\',\''+s.n+'\')"';else if(s.t==='lopen'&&s.k)oc='onclick="startLopen(\''+s.k+'\',\''+s.n+'\')"';else if(s.t==='fiets'&&s.m)oc='onclick="startFiets('+s.m+',\''+s.n+'\')"';
      h+='<div class="wday'+(s.t==='rest'?' dim':'')+(tap?' ':'')+(tap?'" '+oc:'""')+'><div class="wday-lbl">'+s.l+'</div><div class="dot '+dc+'"></div><div class="wday-nm">'+s.n+'</div><div class="wday-dur">'+(s.m?s.m+'m':'')+'</div></div>';}
    h+='</div>';}
  body.innerHTML=h;
}
function setP(p){AP=p;renderSC();}

// ── PROFIEL ───────────────────────────────────────────────────────────────────
function renderP(){
  var s=getS(),inp=document.getElementById('dateinput');
  if(inp&&s.startDate)inp.value=s.startDate;
  var log=getL();
  document.getElementById('p-s').textContent=log.length;
  var rides=log.filter(function(e){return e.t==='fiets';});
  document.getElementById('p-r').textContent=rides.length?Math.max.apply(null,rides.map(function(e){return e.m||0;}))+' min':'—';
  var wt='—';if(s.startDate){var info=getWI();if(info&&!info.future)wt=(info.wi+1)+' van 12';}
  document.getElementById('p-w').textContent=wt;
  var lb=document.getElementById('log-body');
  if(!log.length){lb.innerHTML='<div style="text-align:center;padding:32px;color:#8e8e93;font-size:14px;">Nog geen sessies gelogd.</div>';return;}
  var h='';for(var i=0;i<Math.min(log.length,20);i++){var e=log[i],dc=e.t==='kracht'?'dot-k':e.t==='lopen'?'dot-l':'dot-f',dt=new Date(e.date).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});h+='<div class="logrow"><div class="dot '+dc+'"></div><div class="logrow-info"><div class="logrow-nm">'+e.n+'</div><div class="logrow-dt">'+dt+'</div></div><div class="logrow-dur">'+(e.m?e.m+'m':'')+'</div></div>';}
  lb.innerHTML=h;
}
function setDate(v){var s=getS();s.startDate=v;setS(s);renderT();renderP();}

// ── FIETS ────────────────────────────────────────────────────────────────────
function startFiets(dur,nm){
  var ws=document.getElementById('wkov');ws.style.display='block';
  var total=dur*60,st=Date.now(),paused=false,pausedAt=0,iv;
  function el(){return paused?pausedAt:Math.floor((Date.now()-st)/1000);}
  function rem(){return Math.max(total-el(),0);}
  function render(){var r=rem(),e=el(),pct=Math.min(e/total,1);ws.innerHTML='<div class="wkh"><span class="wkh-close" onclick="closeWk()">✕ Sluiten</span><span class="wkh-title">Fietsen</span><span class="wkh-meta">'+dur+' min</span></div><div class="wkbar"><div class="wkbar-fill" style="width:'+Math.round(pct*100)+'%;"></div></div><div class="wk-body"><div class="wk-nm">🚴 Fietsrit</div><div class="wk-sub">Comfortabel tempo</div><div class="wk-big blue'+(r<10?' pulse':'')+'">'+ft(r)+'</div><div style="font-size:14px;color:#8e8e93;margin-top:10px;">Verstreken: '+ft(e)+'</div></div><div class="wk-btns">'+(r>0?'<button class="btn btn-gray" onclick="fp()">'+(paused?'▶ Hervatten':'⏸ Pauzeren')+'</button>':'<button class="btn btn-green" onclick="fd()">✓ Rit voltooid — opslaan</button>')+'<button class="btn btn-gray" onclick="closeWk()">Stoppen</button></div>';}
  window.fp=function(){if(paused){st=Date.now()-pausedAt*1000;paused=false;iv=setInterval(tick,1000);}else{pausedAt=el();paused=true;clearInterval(iv);}render();};
  window.fd=function(){clearInterval(iv);addL({n:nm||'Fietsen',t:'fiets',m:dur,date:new Date().toISOString()});closeWk();renderT();renderP();toast('Rit voltooid! 🚴');};
  function tick(){if(!paused){if(rem()<=0){clearInterval(iv);triBeep();}render();}}
  iv=setInterval(tick,1000);render();
}

// ── LOPEN ────────────────────────────────────────────────────────────────────
function startLopen(kid,nm){
  var ld=LP[kid];if(!ld)return;
  var ws=document.getElementById('wkov');ws.style.display='block';
  var si=0,segSt=Date.now(),paused=false,pausedAt=0,iv,appSt=Date.now();
  function sel(){return paused?pausedAt:Math.floor((Date.now()-segSt)/1000);}
  function srem(){return Math.max(ld.segs[si].s-sel(),0);}
  function render(){var seg=ld.segs[si],r=srem(),e=sel(),pct=1-r/seg.s,tp=(si+(pct))/ld.segs.length,bg=seg.g?'#e3f5ec':'#fef3c7',col=seg.g?'#1c7d4a':'#b45309',tagCls=seg.g?'seg-walk':'seg-run',tagTxt=seg.g?'WANDELEN / JOGGEN':'LOPEN';ws.innerHTML='<div class="wkh"><span class="wkh-close" onclick="closeWk()">✕</span><span class="wkh-title">'+nm+'</span><span class="wkh-meta">'+(si+1)+'/'+ld.segs.length+'</span></div><div class="wkbar"><div class="wkbar-fill" style="width:'+Math.round(tp*100)+'%;"></div></div><div class="wk-run-body" style="background:'+bg+';"><div class="seg-tag '+tagCls+'">'+tagTxt+'</div><div class="wk-nm" style="color:'+col+';">'+seg.n+'</div><div class="wk-sub">'+seg.i+'</div><div class="wk-big'+(r<6?' pulse':'')+'" style="color:'+col+';">'+ft(r)+'</div></div><div class="wk-btns">'+(r>0?'<button class="btn btn-gray" onclick="lp()">'+(paused?'▶ Hervatten':'⏸ Pauzeren')+'</button>':si<ld.segs.length-1?'<button class="btn btn-blue" onclick="ln()">Volgend segment →</button>':'<button class="btn btn-green" onclick="ld2()">✓ Sessie voltooid</button>')+'<button class="btn btn-gray" onclick="closeWk()">Stoppen</button></div>';}
  window.lp=function(){if(paused){segSt=Date.now()-pausedAt*1000;paused=false;iv=setInterval(tick,500);}else{pausedAt=sel();paused=true;clearInterval(iv);}render();};
  window.ln=function(){si++;segSt=Date.now();pausedAt=0;paused=false;clearInterval(iv);iv=setInterval(tick,500);beep(660);render();};
  window.ld2=function(){clearInterval(iv);var min=Math.round((Date.now()-appSt)/60000);addL({n:nm,t:'lopen',m:min,date:new Date().toISOString()});closeWk();renderT();renderP();toast('Loopsessie voltooid! 🏃');};
  function tick(){if(!paused){if(srem()<=0){clearInterval(iv);triBeep();}render();}}
  iv=setInterval(tick,500);render();
}

// ── KRACHT ────────────────────────────────────────────────────────────────────
function startKracht(kid,nm){
  var wk=WK[kid];if(!wk)return;
  var ws=document.getElementById('wkov');ws.style.display='block';
  var round=0,ei=0,mode='ex',tSt=null,tDur=0,iv,appSt=Date.now();
  function tTot(){return wk.rounds*wk.exs.length;}
  function cStep(){return round*wk.exs.length+ei;}
  function pct(){return cStep()/tTot();}
  function cRem(){return tSt?Math.max(tDur-Math.floor((Date.now()-tSt)/1000),0):tDur;}
  function startTimer(d){tDur=d;tSt=Date.now();iv=setInterval(function(){var r=cRem();if(r===3)beep(660);if(r<=0){clearInterval(iv);triBeep();}render();},500);}
  function startEx(){var ex=wk.exs[ei];if(ex.sec)startTimer(ex.sec);}
  function adv(){mode='ex';tSt=null;startEx();render();}
  function render(){
    if(mode==='done'){var dur=Math.round((Date.now()-appSt)/60000);ws.innerHTML='<div class="wkh"><span></span><span class="wkh-title">'+nm+'</span><span></span></div><div class="wk-complete"><div style="font-size:64px;margin-bottom:14px;">🏆</div><div class="wk-nm">Workout voltooid!</div><div class="wk-sub" style="margin-top:6px;">'+wk.rounds+' ronden · '+(wk.exs.length*wk.rounds)+' sets · '+dur+' min</div></div><div class="wk-btns"><button class="btn btn-green" onclick="kd(\''+kid+'\',\''+nm+'\','+dur+')">✓ Opslaan en afsluiten</button></div>';return;}
    if(mode==='rest'||mode==='roundrest'){var r2=cRem(),nex=mode==='roundrest'?wk.exs[0]:wk.exs[ei],nd=EX[nex.id];ws.innerHTML='<div class="wkh"><span class="wkh-close" onclick="closeWk()">✕</span><span class="wkh-title">'+(mode==='roundrest'?'Pauze':'Rust')+'</span><span class="wkh-meta">Ronde '+(round+1)+'/'+wk.rounds+'</span></div><div class="wkbar"><div class="wkbar-fill" style="width:'+Math.round(pct()*100)+'%;"></div></div><div class="wk-rest-body"><div class="wk-rest-lbl">'+(mode==='roundrest'?'Einde ronde '+(round+1):'Herstel')+'</div><div class="wk-big grn'+(r2<6?' pulse':'')+'">'+ft(r2)+'</div><div class="wk-rest-next">Volgende: '+nd.n+(mode==='roundrest'?' — Ronde '+(round+2):'')+'</div></div><div class="wk-btns"><button class="btn btn-blue" onclick="ks()">Overslaan →</button><button class="btn btn-gray" onclick="closeWk()">Stoppen</button></div>';return;}
    var ex=wk.exs[ei],exd=EX[ex.id],isTimed=!!ex.sec,r3=isTimed?cRem():0;
    ws.innerHTML='<div class="wkh"><span class="wkh-close" onclick="closeWk()">✕</span><span class="wkh-title">Ronde '+(round+1)+'/'+wk.rounds+'</span><span class="wkh-meta">'+(ei+1)+'/'+wk.exs.length+'</span></div><div class="wkbar"><div class="wkbar-fill" style="width:'+Math.round(pct()*100)+'%;"></div></div><div class="wk-body"><div class="wk-nm">'+exd.n+'</div><div class="wk-sub">'+(ex.note||( isTimed?'Houd vast':'Voer uit'))+'</div>'+(isTimed?'<div class="wk-big blue'+(r3<6?' pulse':'')+'">'+ft(r3)+'</div>':'<div class="wk-big">'+ex.reps+'x</div><div style="font-size:16px;color:#8e8e93;margin-top:4px;">'+(ex.note||'herhalingen')+'</div>')+'<div class="wk-tip"><b>📌 Techniek</b><p>'+exd.t+'</p></div></div><div class="wk-btns">'+(isTimed&&r3>0?'<button class="btn btn-gray" onclick="kn()">Overslaan →</button>':'<button class="btn btn-blue" onclick="kn()">✓ Gedaan →</button>')+'<button class="btn btn-gray" onclick="closeWk()">Stoppen</button></div>';
  }
  window.kn=function(){clearInterval(iv);tSt=null;var ex=wk.exs[ei],rd=ex.rest||0;
    if(ei<wk.exs.length-1){ei++;if(rd>0){mode='rest';startTimer(rd);}else{mode='ex';startEx();}}
    else{round++;if(round<wk.rounds){ei=0;mode='roundrest';startTimer(wk.rr);}else{mode='done';triBeep();}}render();};
  window.ks=function(){clearInterval(iv);tSt=null;adv();};
  window.kd=function(id,n,dur){addL({n:n,t:'kracht',m:dur,date:new Date().toISOString()});closeWk();renderT();renderP();toast(n+' voltooid! 💪');};
  startEx();render();
}

// ── CLOSE ────────────────────────────────────────────────────────────────────
function closeWk(){var ws=document.getElementById('wkov');ws.style.display='none';ws.innerHTML='';}

// ── CALENDAR ─────────────────────────────────────────────────────────────────
function exportCal(){
  var s=getS();if(!s.startDate){alert('Stel eerst je startdatum in.');return;}
  var sm=new Date(s.startDate);sm.setHours(0,0,0,0);
  function p(n){return(n<10?'0':'')+n;}
  function id(d,h,m){return d.getFullYear()+''+p(d.getMonth()+1)+''+p(d.getDate())+'T'+p(h||0)+''+p(m||0)+'00';}
  var ev=[];
  for(var i=0;i<SC.length;i++){var wk=SC[i],ws2=new Date(sm);ws2.setDate(ws2.getDate()+(wk.w-1)*7);
    for(var j=0;j<wk.days.length;j++){var ss=wk.days[j];if(ss.t==='rest')continue;if(wk.w<=2&&ss.t==='fiets')continue;
      var d=new Date(ws2);d.setDate(d.getDate()+(ss.d-1));var hr=ss.d===6?9:21,dur=ss.m||40,de=new Date(d);de.setMinutes(de.getMinutes()+dur);
      ev.push('BEGIN:VEVENT\r\nDTSTART;TZID=Europe/Brussels:'+id(d,hr,0)+'\r\nDTEND;TZID=Europe/Brussels:'+id(de,de.getHours(),de.getMinutes())+'\r\nSUMMARY:'+ss.n+' — Week '+wk.w+'\r\nUID:c-w'+wk.w+'-d'+ss.d+'@1000km\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:Herinnering: '+ss.n+'\r\nEND:VALARM\r\nEND:VEVENT');}}
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//1000km//NL\r\nX-WR-CALNAME:1000km Training\r\nCALSCALE:GREGORIAN\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR';
  var b=new Blob([ics],{type:'text/calendar'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='1000km.ics';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
  alert('Agenda gedownload!\n\nOpen het bestand om alle sessies te importeren. Elke sessie heeft een herinnering 30 min van tevoren.');
}

// ── INIT ────────────────────────────────────────────────────────────────────
renderT();
</script>

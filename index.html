<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1000km">
<title>1000km Coach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#EEF1FB;color:#0D1117;}

/* ── TAB BAR ── */
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0A0A1E;z-index:99;padding-bottom:env(safe-area-inset-bottom,14px);padding-top:10px;}
.tab{flex:1;text-align:center;padding:0 2px 4px;cursor:pointer;border:none;background:none;font-family:-apple-system,sans-serif;}
.tab-ic{font-size:21px;display:block;margin-bottom:3px;opacity:.35;}
.tab-lb{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.04em;display:block;text-transform:uppercase;}
.tab.on .tab-ic{opacity:1;}
.tab.on .tab-lb{color:#4D9FFF;}

/* ── SCREENS ── */
.screen{display:none;padding:0 0 100px;}
.screen.on{display:block;}
#s-today{position:fixed;top:0;left:0;right:0;bottom:0;padding-bottom:0;overflow:hidden;display:none;flex-direction:column;}
#s-today.on{display:flex;}

/* ── PAGE HEADERS ── */
.pg-hd{padding:20px 18px 12px;}
.pg-title{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.pg-sub{font-size:13px;color:#8994A6;margin-top:2px;}

/* ── TODAY LAYOUT ── */
.today-head{padding:env(safe-area-inset-top,14px) 18px 10px;background:#EEF1FB;flex-shrink:0;}
.today-greeting{font-size:24px;font-weight:800;letter-spacing:-.4px;}
.today-date{font-size:13px;color:#8994A6;margin-top:2px;}
.today-body{flex:1;overflow:hidden;padding:0 14px;display:flex;flex-direction:column;gap:10px;justify-content:center;}
.today-foot{flex-shrink:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 96px);}

/* ── WEEK PROGRESS ── */
.wkprog{background:#fff;border-radius:14px;padding:11px 14px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.wkprog-row{display:flex;justify-content:space-between;font-size:12px;color:#8994A6;font-weight:600;margin-bottom:7px;}
.wkprog-bar{height:4px;background:#E5E8F5;border-radius:3px;}
.wkprog-fill{height:100%;border-radius:3px;transition:width .4s;}

/* ── MAIN WORKOUT CARD ── */
.sess-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.sess-top{padding:18px 18px 14px;}
.sess-tag{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.sess-nm{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.15;}
.sess-meta{font-size:13px;color:rgba(255,255,255,.75);margin-top:5px;display:flex;gap:14px;}
.overdue-pill{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;padding:3px 10px;border-radius:20px;margin-top:6px;}
.sess-body{padding:14px 16px;}
.bg-k{background:linear-gradient(135deg,#FF6B00,#E84800);}
.bg-l{background:linear-gradient(135deg,#00C896,#009E74);}
.bg-f{background:linear-gradient(135deg,#2E6EFF,#0044CC);}
.bg-rest{background:linear-gradient(135deg,#3A3A5C,#252540);}

/* ── EXERCISE CHIPS ── */
.chips-lbl{font-size:11px;font-weight:700;color:#8994A6;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{padding:6px 11px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:-apple-system,sans-serif;background:#F0F3FF;color:#2E6EFF;transition:background .15s;}
.chip:active{background:#DCE5FF;}
.chip-k{background:#FFF0E5;color:#FF6B00;}
.chip-l{background:#E0FBF3;color:#00A070;}

/* ── GUIDE (lopen/fiets) ── */
.guide-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #F3F4F8;}
.guide-row:last-child{border-bottom:none;}
.g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.g-nm{font-size:14px;font-weight:600;color:#0D1117;}
.g-dt{font-size:12px;color:#8994A6;margin-top:2px;}

/* ── NEXT SESSION STRIP ── */
.next-strip{background:#0A0A1E;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.next-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.next-info{flex:1;}
.next-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;}
.next-nm{font-size:14px;font-weight:700;color:#fff;}
.next-meta{font-size:12px;color:rgba(255,255,255,.4);margin-top:1px;}

/* ── REST CARD ── */
.rest-card{background:#fff;border-radius:20px;padding:32px 20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.rest-ic{font-size:40px;margin-bottom:10px;}
.rest-title{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.rest-sub{font-size:13px;color:#8994A6;margin-top:5px;}

/* ── DONE CARD ── */
.done-card{background:linear-gradient(135deg,#00C896,#009E74);border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 4px 16px rgba(0,200,150,.3);}

/* ── BUTTONS ── */
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;font-family:-apple-system,sans-serif;cursor:pointer;text-align:center;}
.btn:active{opacity:.75;}
.btn-blue{background:#2E6EFF;color:#fff;}
.btn-dark{background:#0A0A1E;color:#fff;}
.btn-gray{background:#EEF1FB;color:#333;}
.btn-red{background:#FFECEC;color:#E84800;}
.btn-green{background:#00C896;color:#fff;}
.btn-orange{background:#FF6B00;color:#fff;}
.btn-sm{padding:11px;font-size:14px;border-radius:12px;}

/* ── SCHEMA ── */
.schema-scroll{padding:0 14px 100px;overflow-y:auto;}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;}
.pills::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;border:2px solid #D8DCF0;color:#8994A6;background:#fff;font-family:-apple-system,sans-serif;cursor:pointer;}
.pill.on{background:#2E6EFF;color:#fff;border-color:#2E6EFF;}
.week-card{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.week-head{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #F3F4F8;}
.week-num{font-size:14px;font-weight:800;}
.week-dt{font-size:11px;color:#8994A6;}
.wd-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #F8F9FC;cursor:pointer;}
.wd-row:last-child{border-bottom:none;}
.wd-row.dim{opacity:.3;cursor:default;}
.wd-row:active:not(.dim){background:#F5F7FF;}
.wd-day{font-size:12px;font-weight:700;color:#B0B8CC;width:24px;}
.wd-date{font-size:11px;color:#C4CAD8;width:44px;}
.wd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dk{background:#FF6B00;}.dl{background:#00C896;}.df{background:#2E6EFF;}.dr{background:#D8DCF0;}
.wd-name{flex:1;font-size:14px;font-weight:600;}
.wd-dur{font-size:12px;color:#B0B8CC;font-weight:600;}

/* ── PRESTATIES ── */
.pres-scroll{padding:0 14px 100px;overflow-y:auto;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.stat-val{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.stat-lbl{font-size:11px;font-weight:700;color:#8994A6;margin-top:5px;text-transform:uppercase;letter-spacing:.05em;}
.stat-box.full{grid-column:1/-1;}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:14px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;}
.bar-lbl{font-size:9px;color:#B0B8CC;font-weight:700;}
.type-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F3F4F8;}
.type-row:last-child{border-bottom:none;}
.type-nm{flex:1;font-size:14px;font-weight:600;}
.type-cnt{font-size:14px;font-weight:700;color:#8994A6;}
.type-dot{width:10px;height:10px;border-radius:50%;}

/* ── PROFIEL ── */
.profiel-scroll{padding:0 14px 100px;overflow-y:auto;}
.sec-lbl{font-size:11px;font-weight:700;color:#8994A6;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;}
.pset{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.prow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #F3F4F8;}
.prow:last-child{border-bottom:none;}
.prow.tap{cursor:pointer;}
.prow.tap:active{background:#F5F7FF;}
.prow-lbl{font-size:15px;}
.prow-val{font-size:14px;color:#8994A6;}
.prow input[type=date]{font-size:14px;color:#2E6EFF;background:transparent;border:none;outline:none;text-align:right;font-family:-apple-system,sans-serif;}
.log-row{background:#fff;border-radius:12px;margin-bottom:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.log-info{flex:1;}
.log-nm{font-size:14px;font-weight:600;}
.log-dt{font-size:12px;color:#8994A6;margin-top:1px;}
.log-dur{font-size:12px;color:#B0B8CC;font-weight:700;}
.empty{text-align:center;padding:32px;color:#B0B8CC;font-size:14px;}

/* ── WORKOUT OVERLAY ── */
#wkov{display:none;position:fixed;inset:0;background:#EEF1FB;z-index:200;overflow-y:auto;padding-bottom:40px;}
.wkh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,16px) + 8px) 18px 0;background:#EEF1FB;}
.wkh-x{font-size:15px;color:#2E6EFF;font-weight:700;cursor:pointer;}
.wkh-t{font-size:15px;font-weight:800;}
.wkh-m{font-size:13px;color:#8994A6;}
.wkpb{height:4px;background:#E5E8F5;margin:12px 18px 0;border-radius:2px;}
.wkpb-f{height:100%;background:#2E6EFF;border-radius:2px;transition:width .4s;}
.wk-main{padding:28px 20px 16px;text-align:center;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wk-nm{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.wk-sub{font-size:15px;color:#8994A6;margin-bottom:24px;padding:0 8px;line-height:1.4;}
.wk-big{font-size:80px;font-weight:800;letter-spacing:-3px;line-height:1;color:#2E6EFF;}
.wk-big.grn{color:#00C896;}
.wk-reps{font-size:80px;font-weight:800;letter-spacing:-3px;line-height:1;color:#0D1117;}
.wk-reps-l{font-size:15px;color:#8994A6;margin-top:6px;}
.wk-tip{background:#F0F4FF;border-radius:14px;padding:12px 16px;margin-top:18px;text-align:left;width:100%;max-width:340px;}
.wk-tip-l{font-size:11px;font-weight:700;color:#2E6EFF;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.wk-tip-t{font-size:13px;color:#444;line-height:1.55;}
.wk-rest-main{background:#E8FCF5;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center;}
.wk-rest-lbl{font-size:12px;font-weight:700;color:#00A070;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.wk-rest-nx{font-size:16px;color:#333;margin-top:14px;}
.wk-done-main{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;}
.wk-stats{display:flex;gap:28px;margin:22px 0;}
.wk-sv{font-size:32px;font-weight:800;color:#2E6EFF;letter-spacing:-.5px;}
.wk-sl{font-size:11px;font-weight:700;color:#8994A6;margin-top:3px;text-transform:uppercase;}
.wk-btns{padding:0 18px 32px;display:flex;flex-direction:column;gap:10px;}

/* ── BOTTOM SHEET ── */
#sheet-ov{display:none;position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:400;}
#sheet-ov.on{display:block;}
#sheet{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;z-index:401;max-height:90vh;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom,20px) 0;}
#sheet.on{display:block;}
.sheet-handle{width:40px;height:4px;background:#DDE1F0;border-radius:2px;margin:14px auto 0;}
.sheet-body{padding:16px 20px 24px;}
.sheet-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px;}
.sheet-sub{font-size:13px;color:#8994A6;margin-bottom:16px;}
.sheet-lbl{font-size:11px;font-weight:700;color:#8994A6;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;}
.sheet-ex-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F8;}
.sheet-ex-row:last-child{border-bottom:none;}
.sheet-ex-n{font-size:15px;font-weight:600;color:#0D1117;}
.sheet-ex-d{font-size:13px;color:#8994A6;margin-top:2px;}
.sheet-ex-num{font-size:12px;color:#C4CAD8;font-weight:700;width:18px;flex-shrink:0;margin-top:2px;}
.muscle-pill{display:inline-block;background:#F0F4FF;color:#2E6EFF;font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;margin:3px;}
.err-box{background:#FFF5F0;border-radius:12px;padding:10px 14px;margin-top:8px;}
.err-lbl{font-size:11px;font-weight:700;color:#FF6B00;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.info-box{background:#F0F4FF;border-radius:12px;padding:10px 14px;margin-top:8px;}
.info-lbl{font-size:11px;font-weight:700;color:#2E6EFF;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.info-txt{font-size:13px;color:#444;line-height:1.55;}
.pending-badge{display:inline-flex;align-items:center;gap:5px;background:#FF6B00;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:8px;}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 1s infinite;}
#toast{position:fixed;bottom:106px;left:14px;right:14px;background:#0A0A1E;color:#fff;padding:14px;border-radius:14px;text-align:center;font-weight:700;font-size:15px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.on{opacity:1;}
</style>
</head>
<body>

<!-- TODAY (fixed) -->
<div id="s-today">
  <div class="today-head">
    <div class="today-greeting" id="t-gr">Goedenavond</div>
    <div class="today-date" id="t-dt"></div>
  </div>
  <div class="today-body" id="t-body"></div>
  <div class="today-foot" id="t-foot"></div>
</div>

<!-- SCHEMA -->
<div id="s-schema" class="screen">
  <div class="pg-hd"><div class="pg-title">Trainingsplan</div><div class="pg-sub">Tik op een sessie voor details</div></div>
  <div class="schema-scroll">
    <div class="pills" id="pills"></div>
    <div id="sc-body"></div>
  </div>
</div>

<!-- PRESTATIES -->
<div id="s-prestaties" class="screen">
  <div class="pg-hd"><div class="pg-title">Prestaties</div><div class="pg-sub">Jouw voortgang in cijfers</div></div>
  <div class="pres-scroll" id="pr-body"></div>
</div>

<!-- PROFIEL -->
<div id="s-profiel" class="screen">
  <div class="pg-hd"><div class="pg-title">Profiel</div><div class="pg-sub">Instellingen &amp; logboek</div></div>
  <div class="profiel-scroll">
    <div class="sec-lbl">Startdatum</div>
    <div class="pset"><div class="prow"><span class="prow-lbl">Eerste trainingsmaandag</span><input type="date" id="di" onchange="setDt(this.value)"></div></div>
    <div class="sec-lbl">Agenda</div>
    <div class="pset"><div class="prow tap" onclick="exportCal()"><span class="prow-lbl">📅 Exporteer naar Apple Agenda</span><span class="prow-val">→</span></div></div>
    <div class="sec-lbl">Statistieken</div>
    <div class="pset">
      <div class="prow"><span class="prow-lbl">Sessies voltooid</span><span class="prow-val" id="ps-s">0</span></div>
      <div class="prow"><span class="prow-lbl">Huidige week</span><span class="prow-val" id="ps-w">—</span></div>
      <div class="prow"><span class="prow-lbl">Langste rit</span><span class="prow-val" id="ps-r">—</span></div>
    </div>
    <div class="sec-lbl">Logboek</div>
    <div id="lb"></div>
    <button class="btn btn-red" style="margin-top:4px;" onclick="if(confirm('Wis je volledige logboek?'))wipeLg()">Logboek wissen</button>
  </div>
</div>

<!-- TAB BAR -->
<div class="tabs">
  <button class="tab on" id="tab-today" onclick="go('today')"><span class="tab-ic">🏠</span><span class="tab-lb">Vandaag</span></button>
  <button class="tab" id="tab-schema" onclick="go('schema')"><span class="tab-ic">📋</span><span class="tab-lb">Schema</span></button>
  <button class="tab" id="tab-prestaties" onclick="go('prestaties')"><span class="tab-ic">📊</span><span class="tab-lb">Prestaties</span></button>
  <button class="tab" id="tab-profiel" onclick="go('profiel')"><span class="tab-ic">⚙️</span><span class="tab-lb">Profiel</span></button>
</div>

<!-- WORKOUT OVERLAY -->
<div id="wkov"></div>

<!-- BOTTOM SHEET -->
<div id="sheet-ov" onclick="closeSheet()"></div>
<div id="sheet"></div>

<div id="toast"></div>

<script>
// ─── EXERCISES ────────────────────────────────────────────────────────────────
var EX = {
  squat: {
    n: 'Squat', icon: '🦵',
    t: 'Voeten iets breder dan schouderbreedte, tenen 15-30° naar buiten. Rug recht, buik gespannen. Zak gecontroleerd tot dijen parallel aan de grond. Knieën actief naar buiten duwen — ze volgen je teenrichting. Terugkomen via de hakken, billen aanspannen bovenaan.',
    m: 'Dijen (quadriceps) · Billen (glutes) · Hamstrings · Kuiten stabiliseren',
    e: 'Knieën vallen naar binnen. Fix: duw ze actief naar buiten en houd dit bewust vast tijdens de volledige beweging.'
  },
  pushup: {
    n: 'Push-up', icon: '💪',
    t: 'Handen iets breder dan schouders, vingers licht naar buiten. Rechte plank van hoofd tot hielen — geen doorgezakte heupen. Ellebogen gaan schuin naar achteren (45°), niet recht opzij. Daal gecontroleerd tot borst bijna de grond raakt. Op knieën starten is prima.',
    m: 'Borst (pectoralis major) · Schouders (deltoid voor) · Triceps · Core stabiliseert',
    e: 'Hoofd naar voren duwen terwijl je daalt. Fix: hou je ogen 20-25 cm voor je handen gericht, niet recht omlaag.'
  },
  plank: {
    n: 'Plank', icon: '🏋️',
    t: 'Onderarmen plat op de grond, ellebogen recht onder de schouders. Voeten heupbreedte. Buik aanspannen alsof je een stomp verwacht — niet ademen inhouden. Heupen niet laten zakken of omhoog steken. Nek neutraal: ogen naar de grond.',
    m: 'Buik (rectus abdominis + transversus) · Onderrug (erector spinae) · Schouders stabiliseren',
    e: 'Adem inhouden om de positie te houden. Dit verhoogt de bloeddruk. Fix: bewust doorademen, zelfs als het moeilijker aanvoelt.'
  },
  lunge: {
    n: 'Lunge', icon: '🦵',
    t: 'Grote stap vooruit, romp rechtop houden. Recht omlaag zakken — achterknie bijna de grond. Voorste knie blijft boven de voet, steekt niet over de teen. Duw jezelf terug naar startpositie via de hiel van het voorste been.',
    m: 'Quadriceps (voor) · Billen (glutes) · Hamstrings (achter) · Kuiten en balans',
    e: 'Voorste knie steekt ver over de teen. Dit overbelast het kniegewricht. Fix: stap groter en zak recht omlaag.'
  },
  mc: {
    n: 'Mountain climbers', icon: '🧗',
    t: 'Begin in push-up positie. Handen recht onder schouders, heupen laag — zelfde hoogte als je schouders, niet omhoog. Trek afwisselend je knieën explosief naar je borst en strek ze terug. Begin kalm en bouw het tempo op wanneer je het ritme te pakken hebt.',
    m: 'Core (buik + lage rug) · Schouders stabiliseren · Hip flexors · Hoge hartslag = cardio',
    e: 'Kont omhoog steken naarmate je vermoeider wordt. Fix: liever iets trager tempo met heupen laag dan snel met slechte houding.'
  },

function gs(){try{return JSON.parse(localStorage.getItem('cs')||'{}');}catch(e){return{};}}
function ss(v){try{localStorage.setItem('cs',JSON.stringify(v));}catch(e){}}
function gl(){try{return JSON.parse(localStorage.getItem('cl')||'[]');}catch(e){return[];}}
function sl(l){try{localStorage.setItem('cl',JSON.stringify(l.slice(0,80)));}catch(e){}}
function addL(e){var l=gl();l.unshift(e);sl(l);}
function wipeLg(){try{localStorage.removeItem('cl');}catch(e){}rP();}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function ft(s){var m=Math.floor(s/60),sc=s%60;return(m<10?'0':'')+m+':'+(sc<10?'0':'')+sc;}
function fmtD(d){return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short'});}
function fmtDow(d){return['zo','ma','di','wo','do','vr','za'][d.getDay()];}
function beep(f,d){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f||880;g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(d||0.15));o.start();o.stop(c.currentTime+(d||0.15));}catch(e){}}
function tri(){beep(880,.1);setTimeout(function(){beep(880,.1);},160);setTimeout(function(){beep(1100,.2);},320);}
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},3000);}
function sessDate(wi,dayOfWeek){var s=gs();if(!s.startDate)return null;var d=new Date(s.startDate);d.setDate(d.getDate()+(wi*7)+(dayOfWeek-1));return d;}
function isDone(date,type){var log=gl(),ds=date.toISOString().split('T')[0];return log.some(function(e){return e.date&&e.date.split('T')[0]===ds&&e.t===type;});}
function getWI(){var s=gs();if(!s.startDate)return null;var st=new Date(s.startDate);st.setHours(0,0,0,0);var td=new Date();td.setHours(0,0,0,0);var d=Math.floor((td-st)/86400000);if(d<0)return{future:true,dl:-d};return{wi:Math.min(Math.floor(d/7),11),wk:SC[Math.min(Math.floor(d/7),11)],dow:td.getDay()};}

// ─── TODAY ────────────────────────────────────────────────────────────────────
function rToday(){
  var now=new Date(),h=now.getHours();
  document.getElementById('t-gr').textContent=(h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond')+', Thiemen';
  document.getElementById('t-dt').textContent=now.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
  var s=gs(),body=document.getElementById('t-body'),foot=document.getElementById('t-foot');

  if(!s.startDate){
    body.innerHTML='<div class="rest-card"><div class="rest-ic">🚴</div><div class="rest-title">Welkom, Thiemen</div><div class="rest-sub" style="margin-bottom:16px;">Stel je startdatum in om te beginnen</div><button class="btn btn-dark" onclick="go(\'profiel\')">Startdatum instellen →</button></div>';
    foot.innerHTML='';return;
  }
  var info=getWI();
  if(!info){body.innerHTML='';foot.innerHTML='';return;}
  if(info.future){
    body.innerHTML='<div class="rest-card"><div class="rest-ic">⏳</div><div class="rest-title">Start over '+info.dl+' dag'+(info.dl===1?'':'en')+'</div><div class="rest-sub">Je eerste trainingsmaandag komt eraan</div></div>';
    foot.innerHTML='';return;
  }

  var log=gl(),wi=info.wi,wkd=info.wk,today=new Date();today.setHours(0,0,0,0);
  var wkSt=new Date(s.startDate);wkSt.setDate(wkSt.getDate()+wi*7);wkSt.setHours(0,0,0,0);
  var wkEn=new Date(wkSt);wkEn.setDate(wkEn.getDate()+7);
  var done=log.filter(function(e){var d=new Date(e.date);return d>=wkSt&&d<wkEn;}).length;

  // Find pending + today
  var pending=[];var todaySess=null;var upcoming=[];
  for(var i=0;i<wkd.days.length;i++){
    var sess=wkd.days[i];if(sess.t==='rest')continue;
    var sd=sessDate(wi,sess.d);if(!sd)continue;sd.setHours(0,0,0,0);
    if(sd<today&&!isDone(sd,sess.t))pending.push({sess:sess,date:sd});
    else if(sd.getTime()===today.getTime())todaySess={sess:sess,date:sd,done:isDone(sd,sess.t)};
    else if(sd>today)upcoming.push({sess:sess,date:sd});
  }

  // Progress bar
  var progHtml='<div class="wkprog"><div class="wkprog-row"><span>Week '+(wi+1)+' · Fase '+wkd.p+'</span><span>'+done+'/3 sessies</span></div><div class="wkprog-bar"><div class="wkprog-fill" style="width:'+Math.round(done/3*100)+'%;background:#2E6EFF;"></div></div></div>';

  // Pick main card: pending first, then today
  var mainHtml='';
  if(pending.length){
    var pp=pending[0];
    mainHtml=buildTodayCard(pp.sess,pp.date,true,pending.length);
  } else if(todaySess){
    if(todaySess.done){
      mainHtml='<div class="done-card"><div style="font-size:36px;margin-bottom:8px;">✅</div><div style="font-size:20px;font-weight:800;color:#fff;">Vandaag gedaan!</div><div style="font-size:13px;color:rgba(255,255,255,.8);margin-top:4px;">'+todaySess.sess.n+'</div></div>';
    } else {
      mainHtml=buildTodayCard(todaySess.sess,todaySess.date,false,0);
    }
  } else {
    mainHtml='<div class="rest-card"><div class="rest-ic">😴</div><div class="rest-title">Rustdag</div><div class="rest-sub">Herstel is training. Actief bewegen mag.</div></div>';
  }

  body.innerHTML=progHtml+mainHtml;

  // Next session strip
  var nxHtml='';
  if(upcoming.length){
    var nx=upcoming[0];
    var nc=nx.sess.t==='kracht'?'#FF6B00':nx.sess.t==='lopen'?'#00C896':'#2E6EFF';
    nxHtml='<div class="next-strip"><div class="next-dot" style="background:'+nc+';"></div><div class="next-info"><div class="next-lbl">Volgende sessie</div><div class="next-nm">'+nx.sess.n+'</div><div class="next-meta">'+fmtDow(nx.date)+' '+fmtD(nx.date)+' · '+nx.sess.m+' min'+(nx.sess.t!=='fiets'?' · na 21u':' · ochtend')+'</div></div></div>';
  } else if(todaySess&&!todaySess.done&&pending.length>1){
    var ns=pending[1];var nc2=ns.sess.t==='kracht'?'#FF6B00':ns.sess.t==='lopen'?'#00C896':'#2E6EFF';
    nxHtml='<div class="next-strip"><div class="next-dot" style="background:'+nc2+';"></div><div class="next-info"><div class="next-lbl">Nog openstaand</div><div class="next-nm">'+ns.sess.n+'</div><div class="next-meta">'+fmtDow(ns.date)+' '+fmtD(ns.date)+'</div></div></div>';
  }
  foot.innerHTML=nxHtml;
}

function buildTodayCard(sess,date,overdue,pendingCount){
  var bg=sess.t==='kracht'?'bg-k':sess.t==='lopen'?'bg-l':'bg-f';
  var icon=sess.t==='kracht'?'💪':sess.t==='lopen'?'🏃':'🚴';
  var ds=date?date.toISOString().split('T')[0]:'';
  var h='<div class="sess-card"><div class="sess-top '+bg+'">';
  h+='<div class="sess-tag">'+(overdue?'⚠️ OPENSTAAND':'Vandaag')+' · '+fmtDow(date)+' '+fmtD(date)+'</div>';
  h+='<div class="sess-nm">'+icon+' '+sess.n+'</div>';
  h+='<div class="sess-meta"><span>⏱ '+(sess.t==='kracht'?'~':'')+sess.m+' min</span><span>'+(sess.t==='fiets'?'Ochtend':'Na 21u')+'</span></div>';
  if(overdue&&pendingCount>1)h+='<div class="overdue-pill">'+pendingCount+' sessies nog te doen</div>';
  h+='</div><div class="sess-body">';

  if(sess.t==='kracht'&&sess.k){
    var wk=WK[sess.k];
    h+='<div class="chips-lbl">'+wk.rounds+' ronden — tik voor uitleg</div><div class="chips">';
    for(var j=0;j<wk.exs.length;j++){
      var ex=wk.exs[j],exd=EX[ex.id];
      h+='<button class="chip chip-k" onclick="showEx(\''+ex.id+'\')">'+exd.n+' '+(ex.s?ex.s+'s':ex.r+(ex.nt?' p/b':'')+' ×')+'</button>';
    }
    h+='</div>';
    h+='<button class="btn btn-dark btn-sm" onclick="startK(\''+sess.k+'\',\''+sess.n+'\',\''+ds+'\')">▶ Start workout</button>';
  } else if(sess.t==='lopen'&&sess.k){
    var lp=LP[sess.k];
    var tot=lp.segs.reduce(function(a,s){return a+s.d;},0);
    h+='<div class="chips-lbl">'+lp.segs.length+' segmenten · '+tot+' min</div><div class="chips">';
    for(var sg=0;sg<lp.segs.length;sg++){
      var seg=lp.segs[sg];
      h+='<button class="chip chip-l" onclick="showLoopGuide(\''+sess.k+'\')">'+seg.n+' '+seg.d+'m</button>';
    }
    h+='</div>';
    h+='<button class="btn btn-green btn-sm" onclick="markDone(\'lopen\',\''+sess.n+'\','+sess.m+',\''+ds+'\')">✓ Sessie voltooid markeren</button>';
  } else if(sess.t==='fiets'){
    var ftips=sess.m>=60?FTIPS_L:FTIPS_S;
    h+='<div class="chips-lbl">Aandachtspunten</div><div class="chips">';
    for(var ft4=0;ft4<ftips.length;ft4++){
      h+='<button class="chip" style="font-size:12px;text-align:left;border-radius:10px;height:auto;white-space:normal;" onclick="showFietsGuide('+sess.m+')">'+ftips[ft4]+'</button>';
    }
    h+='</div>';
    h+='<button class="btn btn-blue btn-sm" onclick="markDone(\'fiets\',\''+sess.n+'\','+sess.m+',\''+ds+'\')">✓ Rit voltooid markeren</button>';
  }
  h+='</div></div>';
  return h;
}

function showLoopGuide(kid){
  var lp=LP[kid];if(!lp)return;
  var h='<div class="sheet-handle"></div><div class="sheet-body">';
  h+='<div class="sheet-title">'+lp.nm+'</div>';
  h+='<div class="sheet-lbl">Opbouw</div>';
  for(var i=0;i<lp.segs.length;i++){var sg=lp.segs[i];h+='<div class="guide-row"><div class="g-dot" style="background:'+(sg.g?'#00C896':'#FF6B00')+';"></div><div><div class="g-nm">'+sg.n+'</div><div class="g-dt">'+sg.d+' min · '+sg.i+'</div></div></div>';}
  h+='<div class="sheet-lbl">Tips</div><div class="info-box">';
  for(var j=0;j<lp.tips.length;j++)h+='<div class="info-txt" style="margin-bottom:6px;">• '+lp.tips[j]+'</div>';
  h+='</div><button class="btn btn-gray" style="margin-top:16px;" onclick="closeSheet()">Sluiten</button></div>';
  openSheet(h);
}

function showFietsGuide(dur){
  var ftips=dur>=60?FTIPS_L:FTIPS_S;
  var h='<div class="sheet-handle"></div><div class="sheet-body">';
  h+='<div class="sheet-title">🚴 Fietsrit '+dur+' min</div>';
  h+='<div class="sheet-lbl">Techniek</div><div class="info-box">';
  for(var i=0;i<ftips.length;i++)h+='<div class="info-txt" style="margin-bottom:6px;">• '+ftips[i]+'</div>';
  h+='</div><button class="btn btn-gray" style="margin-top:16px;" onclick="closeSheet()">Sluiten</button></div>';
  openSheet(h);
}

// ─── SCHEMA ───────────────────────────────────────────────────────────────────
var AP=1;
function rSchema(){
  var s=gs(),h='';
  for(var p=1;p<=3;p++)h+='<button class="pill'+(AP===p?' on':'')+'" onclick="setP('+p+')">Fase '+p+' — wk '+((p-1)*4+1)+'–'+(p*4)+'</button>';
  document.getElementById('pills').innerHTML=h;
  h='';
  for(var i=0;i<SC.length;i++){
    var wk=SC[i];if(wk.p!==AP)continue;
    var wkSt=s.startDate?new Date(s.startDate):null;
    if(wkSt){wkSt=new Date(wkSt);wkSt.setDate(wkSt.getDate()+(wk.w-1)*7);}
    var wkEnd=wkSt?new Date(wkSt.getTime()+6*86400000):null;
    var wkLbl=wkSt?fmtD(wkSt)+' – '+fmtD(wkEnd):'';
    h+='<div class="week-card"><div class="week-head"><strong>Week '+wk.w+'</strong><span class="week-dt">'+wkLbl+'</span></div>';
    for(var j=0;j<wk.days.length;j++){
      var ss2=wk.days[j];
      var dc=ss2.t==='kracht'?'dk':ss2.t==='lopen'?'dl':ss2.t==='fiets'?'df':'dr';
      var sdStr='';
      if(wkSt&&ss2.t!=='rest'){var sd2=new Date(wkSt);sd2.setDate(sd2.getDate()+(ss2.d-1));sdStr=fmtD(sd2);}
      var tap=ss2.t!=='rest';
      var oc=tap?'onclick="showSessSheet('+i+','+j+')"':'';
      h+='<div class="wd-row'+(ss2.t==='rest'?' dim':'')+'" '+oc+'><div class="wd-day">'+ss2.l+'</div><div class="wd-date">'+sdStr+'</div><div class="wd-dot '+dc+'"></div><div class="wd-name">'+ss2.n+'</div><div class="wd-dur">'+(ss2.m?ss2.m+'m':'')+'</div></div>';
    }
    h+='</div>';
  }
  document.getElementById('sc-body').innerHTML=h;
}
function setP(p){AP=p;rSchema();}

// ─── PRESTATIES ───────────────────────────────────────────────────────────────
function rPrestaties(){
  var log=gl(),body=document.getElementById('pr-body'),h='';
  var tot=log.reduce(function(a,e){return a+(e.m||0);},0);
  var kr=log.filter(function(e){return e.t==='kracht';}).length;
  var lo=log.filter(function(e){return e.t==='lopen';}).length;
  var fi=log.filter(function(e){return e.t==='fiets';}).length;
  var mr=fi?Math.max.apply(null,log.filter(function(e){return e.t==='fiets';}).map(function(e){return e.m||0;})):0;
  var streak=0;
  if(log.length){var uq=[];log.forEach(function(e){var ds=e.date.split('T')[0];if(uq.indexOf(ds)<0)uq.push(ds);});uq.sort().reverse();var cur=new Date();cur.setHours(0,0,0,0);for(var i=0;i<uq.length;i++){var dd=new Date(uq[i]);dd.setHours(0,0,0,0);if(Math.floor((cur-dd)/86400000)<=1){streak++;cur=dd;}else break;}}
  if(!log.length){body.innerHTML='<div class="empty">Nog geen sessies. Start een workout om je prestaties bij te houden.</div>';return;}
  h+='<div class="stat-grid">';
  h+='<div class="stat-box"><div class="stat-val" style="color:#2E6EFF;">'+log.length+'</div><div class="stat-lbl">Sessies totaal</div></div>';
  h+='<div class="stat-box"><div class="stat-val" style="color:#FF6B00;">'+Math.round(tot/60)+'u</div><div class="stat-lbl">Trainingstijd</div></div>';
  h+='<div class="stat-box"><div class="stat-val" style="color:#00C896;">'+streak+'</div><div class="stat-lbl">Actieve streak</div></div>';
  h+='<div class="stat-box"><div class="stat-val" style="color:#9B5CF6;">'+(mr||'—')+(mr?'m':'')+'</div><div class="stat-lbl">Langste rit</div></div>';
  h+='</div>';
  h+='<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);">';
  h+='<div style="font-size:13px;font-weight:800;letter-spacing:-.2px;margin-bottom:12px;">Per type</div>';
  h+='<div class="type-row"><div class="type-dot" style="background:#FF6B00;"></div><div class="type-nm">Kracht</div><div class="type-cnt">'+kr+'x</div></div>';
  h+='<div class="type-row"><div class="type-dot" style="background:#00C896;"></div><div class="type-nm">Lopen</div><div class="type-cnt">'+lo+'x</div></div>';
  h+='<div class="type-row"><div class="type-dot" style="background:#2E6EFF;"></div><div class="type-nm">Fietsen</div><div class="type-cnt">'+fi+'x</div></div>';
  h+='</div>';
  h+='<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);">';
  h+='<div style="font-size:13px;font-weight:800;margin-bottom:4px;">Activiteit — afgelopen 8 weken</div>';
  var wks=[],maxS=0;
  for(var w=7;w>=0;w--){var ws2=new Date();ws2.setDate(ws2.getDate()-((ws2.getDay()||7)-1)-w*7);ws2.setHours(0,0,0,0);var we2=new Date(ws2);we2.setDate(we2.getDate()+7);var cnt=log.filter(function(e){var d=new Date(e.date);return d>=ws2&&d<we2;}).length;wks.push({cnt:cnt,lbl:fmtD(ws2).split(' ')[0]});if(cnt>maxS)maxS=cnt;}
  if(maxS===0)maxS=1;
  h+='<div class="bar-chart">';
  for(var bw=0;bw<wks.length;bw++){var ht=Math.max(Math.round(wks[bw].cnt/maxS*50),wks[bw].cnt>0?6:3);var bc=wks[bw].cnt>0?'#2E6EFF':'#E5E8F5';h+='<div class="bar-col"><div class="bar" style="height:'+ht+'px;background:'+bc+';"></div><div class="bar-lbl">'+wks[bw].lbl+'</div></div>';}
  h+='</div></div>';
  body.innerHTML=h;
}

// ─── PROFIEL ─────────────────────────────────────────────────────────────────
function rP(){
  var s=gs(),inp=document.getElementById('di');
  if(inp&&s.startDate)inp.value=s.startDate;
  var log=gl();
  document.getElementById('ps-s').textContent=log.length;
  var rides=log.filter(function(e){return e.t==='fiets';});
  document.getElementById('ps-r').textContent=rides.length?Math.max.apply(null,rides.map(function(e){return e.m||0;}))+' min':'—';
  var wt='—';if(s.startDate){var info=getWI();if(info&&!info.future)wt=(info.wi+1)+' van 12';}
  document.getElementById('ps-w').textContent=wt;
  var lb=document.getElementById('lb');
  if(!log.length){lb.innerHTML='<div class="empty">Nog geen sessies gelogd.</div>';return;}
  var h='';for(var i=0;i<Math.min(log.length,25);i++){var e=log[i],dc=e.t==='kracht'?'dk':e.t==='lopen'?'dl':'df',dt=new Date(e.date).toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'});h+='<div class="log-row"><div class="wd-dot '+dc+'" style="width:10px;height:10px;"></div><div class="log-info"><div class="log-nm">'+e.n+'</div><div class="log-dt">'+dt+'</div></div><div class="log-dur">'+(e.m?e.m+'m':'')+'</div></div>';}
  lb.innerHTML=h;
}
function setDt(v){var s=gs();s.startDate=v;ss(s);rToday();rP();}

// ─── KRACHT WORKOUT ───────────────────────────────────────────────────────────
function startK(kid,nm,dateStr){
  var wk=WK[kid];if(!wk)return;
  closeSheet();
  var ws=document.getElementById('wkov');ws.style.display='block';
  var round=0,ei=0,mode='ex',tSt=null,tDur=0,iv,appSt=Date.now();
  var lds=dateStr||(new Date().toISOString().split('T')[0]);
  function tot(){return wk.rounds*wk.exs.length;}
  function step(){return round*wk.exs.length+ei;}
  function pct(){return step()/tot();}
  function rem(){return tSt?Math.max(tDur-Math.floor((Date.now()-tSt)/1000),0):tDur;}
  function startT(d){tDur=d;tSt=Date.now();iv=setInterval(function(){var r=rem();if(r===3)beep(660);if(r<=0){clearInterval(iv);tri();}render();},500);}
  function startEx(){var ex=wk.exs[ei];if(ex.s)startT(ex.s);}
  function render(){
    var dur=Math.round((Date.now()-appSt)/60000);
    if(mode==='done'){
      ws.innerHTML='<div class="wkh"><span></span><span class="wkh-t">'+nm+'</span><span></span></div><div class="wk-done-main"><div style="font-size:60px;margin-bottom:14px;">🏆</div><div class="pg-title">Workout voltooid!</div><div style="font-size:14px;color:#8994A6;margin-top:6px;">'+wk.rounds+' ronden · '+(wk.exs.length*wk.rounds)+' sets</div><div class="wk-stats"><div style="text-align:center;"><div class="wk-sv">'+wk.rounds+'</div><div class="wk-sl">Ronden</div></div><div style="text-align:center;"><div class="wk-sv">'+dur+'</div><div class="wk-sl">Minuten</div></div></div></div><div class="wk-btns"><button class="btn btn-green" onclick="kDone(\''+kid+'\',\''+nm+'\','+dur+',\''+lds+'\')">✓ Opslaan en afsluiten</button></div>';
      return;
    }
    if(mode==='rest'||mode==='roundrest'){
      var r2=rem(),nex=mode==='roundrest'?wk.exs[0]:wk.exs[ei],nd=EX[nex.id];
      ws.innerHTML='<div class="wkh"><span class="wkh-x" onclick="stopWk()">✕</span><span class="wkh-t">'+(mode==='roundrest'?'Pauze':'Rust')+'</span><span class="wkh-m">Ronde '+(round+1)+'/'+wk.rounds+'</span></div><div class="wkpb"><div class="wkpb-f" style="width:'+Math.round(pct()*100)+'%;"></div></div><div class="wk-rest-main"><div class="wk-rest-lbl">'+(mode==='roundrest'?'Einde ronde '+(round+1):'Herstel')+'</div><div class="wk-big grn'+(r2<6?' pulse':'')+'">'+ft(r2)+'</div><div class="wk-rest-nx">Volgende: '+nd.n+(mode==='roundrest'?' — Ronde '+(round+2):'')+'</div></div><div class="wk-btns"><button class="btn btn-dark" onclick="kSkip()">Overslaan →</button><button class="btn btn-red" onclick="stopWk()">✕ Stoppen</button></div>';
      return;
    }
    var ex=wk.exs[ei],exd=EX[ex.id],isTimed=!!ex.s,r3=isTimed?rem():0;
    ws.innerHTML='<div class="wkh"><span class="wkh-x" onclick="stopWk()">✕</span><span class="wkh-t">Ronde '+(round+1)+'/'+wk.rounds+'</span><span class="wkh-m">'+(ei+1)+'/'+wk.exs.length+'</span></div><div class="wkpb"><div class="wkpb-f" style="width:'+Math.round(pct()*100)+'%;"></div></div><div class="wk-main"><div class="wk-nm">'+exd.n+'</div><div class="wk-sub">'+(ex.nt||(isTimed?'Houd positie vast':'Voer uit op tempo'))+'</div>'+(isTimed?'<div class="wk-big'+(r3<6?' pulse':'')+'">'+ft(r3)+'</div>':'<div class="wk-reps">'+ex.r+'x</div><div class="wk-reps-l">'+(ex.nt||'herhalingen')+'</div>')+'<div class="wk-tip"><div class="wk-tip-l">📌 Techniek</div><div class="wk-tip-t">'+exd.t.split('.')[0]+'.</div></div></div><div class="wk-btns">'+(isTimed&&r3>0?'<button class="btn btn-dark" onclick="kNext()">Overslaan →</button>':'<button class="btn btn-dark" onclick="kNext()">✓ Gedaan →</button>')+'<button class="btn btn-red" onclick="stopWk()">✕ Stoppen</button></div>';
  }
  window.kNext=function(){clearInterval(iv);tSt=null;var ex=wk.exs[ei],rd=ex.rest||0;if(ei<wk.exs.length-1){ei++;if(rd>0){mode='rest';startT(rd);}else{mode='ex';startEx();}}else{round++;if(round<wk.rounds){ei=0;mode='roundrest';startT(wk.rr);}else{mode='done';tri();}}render();};
  window.kSkip=function(){clearInterval(iv);tSt=null;mode='ex';startEx();render();};
  window.kDone=function(id,n,dur,ds){addL({n:n,t:'kracht',m:dur,date:ds+'T20:00:00.000Z'});closeWk();rToday();rPrestaties();toast(n+' voltooid! 💪');};
  startEx();render();
}

function stopWk(){if(confirm('Workout stoppen?\nJe voortgang in deze sessie gaat verloren.')){closeWk();}}
function closeWk(){var ws=document.getElementById('wkov');ws.style.display='none';ws.innerHTML='';}

// ─── CALENDAR ────────────────────────────────────────────────────────────────
function exportCal(){
  var s=gs();if(!s.startDate){alert('Stel eerst je startdatum in.');return;}
  var sm=new Date(s.startDate);sm.setHours(0,0,0,0);
  function p(n){return(n<10?'0':'')+n;}
  function id(d,h,m){return d.getFullYear()+''+p(d.getMonth()+1)+''+p(d.getDate())+'T'+p(h||0)+''+p(m||0)+'00';}
  var ev=[];
  for(var i=0;i<SC.length;i++){var wk=SC[i],ws2=new Date(sm);ws2.setDate(ws2.getDate()+(wk.w-1)*7);
    for(var j=0;j<wk.days.length;j++){var ss3=wk.days[j];if(ss3.t==='rest')continue;if(wk.w<=2&&ss3.t==='fiets')continue;
      var d=new Date(ws2);d.setDate(d.getDate()+(ss3.d-1));var hr=ss3.d===6?9:21,dur=ss3.m||40;
      var de=new Date(d.getTime()+dur*60000);
      ev.push('BEGIN:VEVENT\r\nDTSTART;TZID=Europe/Brussels:'+id(d,hr,0)+'\r\nDTEND;TZID=Europe/Brussels:'+id(de,de.getHours(),de.getMinutes())+'\r\nSUMMARY:'+ss3.n+' — Week '+wk.w+'\r\nUID:c'+wk.w+'d'+ss3.d+'@1000km\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:'+ss3.n+' over 30 min!\r\nEND:VALARM\r\nEND:VEVENT');
    }
  }
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//1000km//NL\r\nX-WR-CALNAME:1000km Training\r\nCALSCALE:GREGORIAN\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR';
  var uri='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  window.open(uri);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
rToday();
